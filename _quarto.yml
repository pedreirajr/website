project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"

website:
  title: "🚆 Jorge Ubirajara Pedreira Junior"
  site-url: https://pedreirajr.github.io/website
  search: true
  open-graph: true
  navbar:
    background: primary
    right:
      - href: index.qmd
        text: "🏠 Home"
      - href: publications.qmd
        text: "📝 Publications"
      - href: codeanddata.qmd
        text: "💻 Code and Data"
      - href: talks.qmd
        text: "📣 Talks"
      - href: about.qmd
        text: "👨🏻‍🏫 About me"
  page-footer:
    center: |
      Jorge Ubirajara Pedreira Junior | Powered by [Quarto](https://quarto.org)

format:
  html:
    theme:
      - darkly
      - brand
    css: styles.css
    include-in-header:
      - text: '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">'
    include-after-body:
      - text: |
          <script>
          document.querySelectorAll('a.btn:not([download])').forEach(function(btn) {
            btn.setAttribute('target', '_blank');
            btn.setAttribute('rel', 'noopener noreferrer');
          });
          </script>
    toc: true

execute:
  freeze: auto

editor: visual
